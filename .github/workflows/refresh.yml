name: Refresh profile activity

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.private == false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the public default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh public project data
        env:
          PUBLIC_PROJECT_REPOSITORY: ${{ vars.PUBLIC_PROJECT_REPOSITORY }}
        run: python3 scripts/refresh.py --live
      - name: Publish changes when the data changed
        run: |
          set -euo pipefail
          git add -- data/public-activity.json data/activity-summary.md
          if git diff --cached --quiet; then
            echo "The generated profile is up to date."
            exit 0
          fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh public profile activity'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
