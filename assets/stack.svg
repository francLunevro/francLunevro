<svg xmlns="http://www.w3.org/2000/svg" width="720" height="211" viewBox="0 0 720 211" role="img" aria-labelledby="title desc">
<title id="title">Technical stack</title>
<desc id="desc">Backend, web, and delivery tools.</desc>
<defs>
  <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop stop-color="#10192b"/><stop offset=".62" stop-color="#0a1020"/><stop offset="1" stop-color="#13112b"/>
  </linearGradient>
  <linearGradient id="signal" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop stop-color="#64dcf7"/><stop offset=".54" stop-color="#769bff"/><stop offset="1" stop-color="#bb91ff"/>
  </linearGradient>
  <clipPath id="bounds"><rect x="1" y="1" width="718" height="209" rx="23"/></clipPath>
  
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.045em}
.rise{animation:rise 760ms cubic-bezier(.2,.65,.3,1) both;animation-delay:var(--delay,0ms)}
.sweep{animation:sweep 1700ms 180ms ease-out both}
.trace{stroke-dasharray:100;animation:trace 1600ms 200ms ease-out both}
.reveal{transform-box:fill-box;transform-origin:left center;animation:reveal 850ms 200ms ease-out both}
@keyframes rise{from{opacity:.15;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes sweep{from{opacity:0;transform:translateX(-335px)}35%{opacity:1}to{opacity:0;transform:translateX(610px)}}
@keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes reveal{from{opacity:.25;transform:scaleX(.02)}to{opacity:1;transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{opacity:0}}
</style>
<rect x="1" y="1" width="718" height="209" rx="23" fill="url(#panel)" stroke="#2a3c5e"/>
<g clip-path="url(#bounds)">
<g class="rise" style="--delay:0ms"><rect x="32" y="27" width="319" height="157" rx="15" fill="#141e36" stroke="#2a3c5e"/><rect x="50" y="47" width="38" height="36" rx="9" fill="#202e4c" stroke="none"/><path d="m0 12 11-10 11 10-11 10Z M11 22v8" transform="translate(57 51)" fill="none" stroke="#89e6f7" stroke-width="1.55" stroke-linejoin="round"/><text class="mono" x="100" y="69" font-size="17" fill="#89e6f7" font-weight="700">BACKEND</text><text x="52" y="110" font-size="24" fill="#f1f5ff" font-weight="700">JavaScript</text><text x="52" y="138" font-size="24" fill="#adbcd4" font-weight="400">Node.js · discord.js</text><text x="52" y="166" font-size="24" fill="#adbcd4" font-weight="400">Express · SQLite</text></g><g class="rise" style="--delay:100ms"><rect x="369" y="27" width="319" height="157" rx="15" fill="#141e36" stroke="#2a3c5e"/><rect x="387" y="47" width="38" height="36" rx="9" fill="#202e4c" stroke="none"/><path d="M1 4h21v15H1Z M6 25h11 M11 19v6" transform="translate(394 51)" fill="none" stroke="#bf9dff" stroke-width="1.55" stroke-linejoin="round"/><text class="mono" x="437" y="69" font-size="17" fill="#bf9dff" font-weight="700">WEB &amp; DELIVERY</text><text x="389" y="110" font-size="24" fill="#f1f5ff" font-weight="700">React · Vite</text><text x="389" y="138" font-size="24" fill="#adbcd4" font-weight="400">GitHub Actions</text><text x="389" y="166" font-size="24" fill="#adbcd4" font-weight="400">Docker</text></g>
</g>
</svg>
